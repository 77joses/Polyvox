<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>PolyVox</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
    <script src="https://surikov.github.io/webaudiofontdata/sound/0190_Chaos_sf2_file.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; font-family: sans-serif; }
        #header {
            background: #1B5E20;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #header h1 { color: #F9A825; font-size: 20px; }
        #toolbar {
            background: #1E1E1E;
            padding: 6px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 1px solid #333;
        }
        #notePanel {
            background: #1E1E1E;
            padding: 6px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-top: 1px solid #333;
        }
        .tool-label {
            color: #888;
            font-size: 10px;
            align-self: center;
            margin-right: 2px;
        }
        .tbtn {
            background: #2A2A2A;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .tbtn.active { background: #F9A825; color: black; }
        .tbtn.rec { background: #1B5E20; }
        .tbtn.stp { background: #B71C1C; }
        .tbtn.ply { background: #1565C0; }
        .tbtn:disabled { opacity: 0.4; }
        #status {
            text-align: center;
            color: #F9A825;
            padding: 5px;
            font-size: 12px;
            background: #1A1A1A;
            min-height: 24px;
        }
        #scoreWrapper {
            overflow: auto;
            background: #f5f0e8;
            height: calc(100vh - 220px);
        }
        select.tbtn { padding: 5px 6px; }
    </style>
</head>
<body>
<div id="header">
    <h1>🎵 PolyVox</h1>
    <div style="display:flex;gap:5px">
        <button class="tbtn rec" id="btnRecord">🎤 Rec</button>
        <button class="tbtn stp" id="btnStop" disabled>⏹</button>
        <button class="tbtn ply" id="btnPlay" disabled>▶ Voice</button>
        <button class="tbtn" id="btnPlayOrgan" disabled style="background:#2E7D32">▶ Organ</button>
    </div>
</div>

<div id="toolbar">
    <span class="tool-label">KEY</span>
    <button class="tbtn" id="btnKeyDown">♭</button>
    <button class="tbtn" id="keyDisplay" style="min-width:36px">C</button>
    <button class="tbtn" id="btnKeyUp">♯</button>
    <span class="tool-label" style="margin-left:6px">TIME</span>
    <select class="tbtn" id="timeSig">
        <option>4/4</option>
        <option>3/4</option>
        <option>2/4</option>
        <option>6/8</option>
    </select>
    <span class="tool-label" style="margin-left:6px">BPM</span>
    <button class="tbtn" id="btnTapTempo">TAP</button>
    <span class="tbtn" id="bpmDisplay">120</span>
    <button class="tbtn" id="btnAddBar">+4 Bars</button>
    <button class="tbtn" id="btnPrint">🖨️</button>
</div>

<div id="status">Loading organ sounds...</div>

<div id="scoreWrapper">
    <svg id="scoreSvg"></svg>
</div>

<div id="notePanel">
    <span class="tool-label">DUR</span>
    <button class="tbtn active" data-dur="whole">𝅝</button>
    <button class="tbtn" data-dur="half">𝅗𝅥</button>
    <button class="tbtn" data-dur="quarter">♩</button>
    <button class="tbtn" data-dur="eighth">♪</button>
    <button class="tbtn" data-dur="sixteenth">𝅘𝅥𝅯</button>
    <span class="tool-label" style="margin-left:4px">MOD</span>
    <button class="tbtn" id="btnDot">•</button>
    <button class="tbtn" id="btnSharp">♯</button>
    <button class="tbtn" id="btnFlat">♭</button>
    <button class="tbtn" id="btnRest">𝄽</button>
    <button class="tbtn" id="btnDelete" style="background:#5A1A1A">🗑</button>
</div>

<script src="app.js"></script>
</body>
</html>
